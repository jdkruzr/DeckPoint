name: DeckPoint Release

# Push a tag vX.Y.Z (matching [crosspoint] version in platformio.ini) to build
# the release firmware and publish it as a GitHub release on this repo with one
# deckpoint-<board>.bin per board. The on-device updater (Settings > Check for
# updates) reads releases/latest and installs the asset named for its board.
# Tags with a pre-release suffix (v0.2.0-rc1) are published as pre-releases,
# which releases/latest (and therefore OTA) ignores.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          # board must match FirmwareBoardTag.cpp's name for the env.
          - env: tdeckpro-gh_release
            board: tdeckpro
          - env: x4pro-gh_release
            board: x4pro
    steps:
      - uses: actions/checkout@v6

      - name: Validate tag against platformio.ini
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${TAG#v}"
          base_version="${tag_version%%-*}"
          configured="$(python3 -c "import configparser; c = configparser.ConfigParser(); c.read('platformio.ini'); print(c.get('crosspoint', 'version'))")"
          if [ "$base_version" != "$configured" ]; then
            echo "::error::Tag $TAG does not match platformio.ini version $configured"
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # Same pins as ci.yml: platform-espressif32's builder imports these unconditionally.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # See ci.yml and https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e "${{ matrix.env }}"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build firmware
        run: pio run -e "${{ matrix.env }}" -j1

      - name: Name firmware assets
        run: |
          set -euo pipefail
          # OTA image (app only) and the full image for a first install over USB
          # (bootloader + partition table + app, written at 0x0).
          cp ".pio/build/${{ matrix.env }}/firmware.bin" "deckpoint-${{ matrix.board }}.bin"
          cp ".pio/build/${{ matrix.env }}/firmware.factory.bin" "deckpoint-${{ matrix.board }}-full.bin"

      - name: Stage firmware asset
        uses: actions/upload-artifact@v6
        with:
          name: deckpoint-${{ matrix.board }}
          path: deckpoint-${{ matrix.board }}*.bin
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download firmware assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: deckpoint-*
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for board in tdeckpro x4pro; do
            test -f "dist/deckpoint-${board}.bin"
            test -f "dist/deckpoint-${board}-full.bin"
          done
          (cd dist && sha256sum deckpoint-*.bin > SHA256SUMS)
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          notes=(--generate-notes)
          if [ -f "docs/release-notes/${TAG}.md" ]; then notes=(--notes-file "docs/release-notes/${TAG}.md"); fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/deckpoint-*.bin dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/deckpoint-*.bin dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
              --title "DeckPoint $TAG" "${notes[@]}" --verify-tag "${prerelease[@]}"
          fi
